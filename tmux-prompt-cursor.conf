# Keep the upstream command shape: select the clicked pane first, then choose
# between moving the ZLE cursor and passing the original mouse event through.
# Putting select-pane inside the if-shell branches makes tmux parse it as part
# of the command string and can produce “too many arguments”.
bind-key -T root MouseDown1Pane select-pane -t = \; if-shell -F "#{?#{&&:#{==:#{@tmux-prompt-cursor-active},1},#{==:#{mouse_y},#{cursor_y}}},1,}" { run-shell -b "#{@tmux-prompt-cursor-root}/bin/prompt-cursor-click #{mouse_pane} #{mouse_x} #{mouse_y}" } { send-keys -M }
